definitions:
  - &site_name >-
    {{ config.site_name }}
  # The title drawn on the card: card_title from the page's front matter if
  # set (the home page uses its headline), else the page title.
  - &page_title >-
    {{ page.meta.get("card_title", page.meta.get("title", page.title)) }}
  # The og:title / twitter:title: the page title alone (platforms show the
  # site name separately, from og:site_name), or the site name on the home
  # page, so link previews don't truncate a long combined title.
  - &og_title >-
    {%- if not page.is_homepage -%}
      {{ page.meta.get("title", page.title) }}
    {%- else -%}
      {{ config.site_name }}
    {%- endif -%}
  - &page_description >-
    {{ page.meta.get("description", config.site_description) | x }}
  - &logo >-
    {{ config.docs_dir }}/{{ config.theme.logo }}

tags:
  og:type: website
  og:site_name: *site_name
  og:title: *og_title
  og:description: *page_description
  og:image: "{{ image.url }}"
  og:image:type: "{{ image.type }}"
  og:image:width: "{{ image.width }}"
  og:image:height: "{{ image.height }}"
  og:image:alt: *og_title
  og:url: "{{ page.canonical_url }}"
  twitter:card: summary_large_image
  twitter:title: *og_title
  twitter:description: *page_description
  twitter:image: "{{ image.url }}"

size: { width: 1200, height: 630 }
layers:
  # Background: the site's dark mode background
  - background:
      color: "#191525"
  # Lime bar along the bottom edge
  - size: { width: 1200, height: 10 }
    offset: { x: 0, y: 620 }
    background:
      color: "#ceff05"
  # Logo
  - size: { width: 144, height: 144 }
    offset: { x: 992, y: 64 }
    background:
      image: *logo
  # Site name, in lime
  - size: { width: 832, height: 42 }
    offset: { x: 64, y: 64 }
    typography:
      content: *site_name
      color: "#ceff05"
      font:
        family: Funnel Display
        style: Bold
  # Page title
  - size: { width: 832, height: 310 }
    offset: { x: 62, y: 160 }
    typography:
      content: *page_title
      align: start
      color: "#ffffff"
      line:
        amount: 3
        height: 1.25
      font:
        family: Funnel Display
        style: Bold
  # Page description
  - size: { width: 832, height: 64 }
    offset: { x: 64, y: 512 }
    typography:
      content: *page_description
      align: start
      color: "#ffffffb3"
      line:
        amount: 2
        height: 1.5
      font:
        family: Funnel Display
        style: Regular
