# Migration stub: steel-website now uses just (https://just.systems)
# Install just: https://just.systems/man/en/pre-built-binaries.html
#
# Run `just` to see all available recipes.

[tox]
envlist = py3

[testenv]
allowlist_externals = printf, false
skip_install = true
deps =
commands =
    printf '\n\033[1m  steel-website has migrated from tox to just.\033[0m\n  Install just: https://just.systems/man/en/pre-built-binaries.html\n\n  Run \033[1m"just"\033[0m to see all available recipes.\n  The old tox envs are \033[1m"just static"\033[0m and \033[1m"just build"\033[0m.\n\n'
    false


[testenv:py3]

