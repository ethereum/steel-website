name: Setup uv and just
description: Install uv and just for CI jobs; uv takes the Python version from .python-version
inputs:
  enable-cache:
    description: Enable uv dependency cache
    default: "auto"
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: ${{ inputs.enable-cache }}
        version: "0.13.4"
    - name: Install just
      uses: taiki-e/install-action@e24b8b7a939c6a537188f34a4163cb153dd85cf6 # v2.69.1
      with:
        tool: just@1.46
