name: Setup uv and just
description: Install uv and just for CI jobs; uv takes the Python version from .python-version
inputs:
  enable-cache:
    description: Enable uv dependency cache
    default: "auto"
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: ${{ inputs.enable-cache }}
        version: "0.13.4"
    - name: Install just
      uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
      with:
        tool: just@1.46
