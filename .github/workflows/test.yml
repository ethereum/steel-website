name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  static:
    name: Static checks (uv.lock, spellcheck, actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ethereum/steel-website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
      - name: Run static checks
        run: just static

  build:
    name: Build the site and check its links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ethereum/steel-website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
      # A pinned lychee release, verified against its SHA-256. To update, take
      # the version and the x86_64-unknown-linux-gnu checksum from
      # https://github.com/lycheeverse/lychee/releases.
      - name: Install lychee
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$archive"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Build the site and check links and images
        run: just check-links
