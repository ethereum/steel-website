# Zensical configuration for the Ethereum Foundation Specs team website,
# served at specs.ethereum.foundation.
# Reference: https://zensical.org/docs/setup/basics/

[project]
site_name = "Ethereum Foundation · Protocol · Specs"
site_description = "The Ethereum Foundation Specs team maintains the specifications and reference tests for Ethereum's execution and consensus layers."
site_author = "specs@ethereum.foundation"
site_url = "https://specs.ethereum.foundation/"
copyright = """
Copyright &copy; 2026 The Ethereum Foundation Specs Team
"""

# The repository is linked in the header, and edit_uri gives every page an
# "Edit this page" and a "View source" button. edit_uri must sit here in
# [project], not in [project.theme], or the buttons don't appear.
repo_url = "https://github.com/ethereum/protocol-specs-website"
repo_name = "ethereum/protocol-specs-website"
edit_uri = "edit/main/docs/"

# The execution-specs docs under /docs/execution-specs/ are not built here:
# the deploy workflow adds them after the build (see docs-config.yml).
nav = [
    { "Home" = "index.md" },
    { "About" = "about.md" },
    { "Specs [EL]" = "el.md" },
    { "Specs [CL]" = "cl.md" },
    { "Team" = "team.md" },
    { "Docs" = "docs/index.md" },
    { "Blog" = "blog/index.md" },
]

extra_css = ["assets/stylesheets/fonts.css", "assets/stylesheets/extra.css"]

[project.theme]
logo = "assets/images/home/specs-dark.png"
favicon = "assets/images/favicon.ico"
language = "en"

# Template overrides: the 404 page and the blog partials.
custom_dir = "overrides"

# Don't load fonts from Google Fonts. Funnel Display (headings), Funnel Sans
# (text) and JetBrains Mono (code) are self-hosted in docs/assets/fonts/ and
# set up in docs/assets/stylesheets/fonts.css, so pages make no third-party requests and
# the build needs no network.
font = false

# Reference: https://zensical.org/docs/setup/navigation/ and the pages next to
# it for each feature.
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# Light and dark mode. The colours themselves are set in
# docs/assets/stylesheets/extra.css (see "Palette" at the top).
[[project.theme.palette]]
scheme = "default"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------

# Blog: posts live in docs/blog/posts/, authors in docs/blog/.authors.yml.
# The index (docs/blog/index.md) lists every post; partials/post.html in
# overrides/ shapes each entry. post_url_format = "{file}" keeps the URLs the
# posts had before the plugin, /blog/<file name>/.
#
# Read more: https://zensical.org/docs/setup/blog/
[project.plugins.blog]
post_url_format = "{file}"
archive = false
categories = false

# Redirect URLs from the old Hugo site (/<page>/main/ and /blog_posts/blog/)
# to their current pages. Keys are source paths relative to docs_dir; values
# are the target pages.
[project.plugins.redirects.redirect_maps]
"home/main.md" = "index.md"
"responsibilities/main.md" = "el.md"
"responsibilities.md" = "el.md"
"team/main.md" = "team.md"
"blog_posts/blog/2025-09-11_weld-announcement.md" = "blog/posts/2025-09-11_weld-announcement.md"
"blog_posts/blog/2025-09-15_eth-config.md" = "blog/posts/2025-09-15_eth-config.md"
"blog_posts/blog/2025-11-04_weld_final.md" = "blog/posts/2025-11-04_weld_final.md"

# Generate /llms.txt (an index for LLM tools) and /llms-full.txt (all pages
# as Markdown in one file).
[project.plugins.llmstxt]
markdown_description = "Specs is the Ethereum Foundation team that maintains the specifications and reference tests of Ethereum's execution layer (Specs [EL], ethereum/execution-specs) and consensus layer (Specs [CL], ethereum/consensus-specs). It was formed in 2026 when STEEL (Specifications and Testing for the Ethereum Execution Layer) and the consensus specs team merged."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"About Specs" = [
    { "index.md" = "What the Specs team is and what it works on" },
    { "about.md" = "Mission, collaborators and team history" },
    { "el.md" = "Specs [EL]: execution layer specs, tests, tools and releases" },
    { "cl.md" = "Specs [CL]: consensus layer specs, reference tests, c-kzg-4844 and releases" },
    { "team.md" = "Team members" },
    { "docs/index.md" = "Entry point to the execution-specs documentation" },
]
"Blog" = ["blog/posts/*.md"]

# Social cards: a 1200 x 630 preview image per page, plus the og: and twitter:
# meta tags that X, Telegram, Discord and LinkedIn read when a link is shared.
# layouts/specs.yml draws them in the site's colours. The plugin downloads its
# font (Funnel Display) from Google Fonts on every build, so building needs
# internet access; if Google Fonts can't be reached, the build fails.
[project.plugins.social]
cards_layout_dir = "layouts"
cards_layout = "specs"

# Minify HTML (including inline scripts and styles) and the custom CSS.
# cache_safe adds a content hash to the minified CSS file names (for example
# extra.<hash>.min.css), so browsers fetch the new file after every change
# instead of reusing a cached copy.
[project.plugins.minify]
cache_safe = true
minify_html = true
minify_inline_js = true
minify_inline_css = true
minify_css = true
css_files = ["assets/stylesheets/fonts.css", "assets/stylesheets/extra.css"]
